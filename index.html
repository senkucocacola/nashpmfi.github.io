<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои категории</title>
    <!-- Подключаем наш файл стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Категории проекта</h1>
        <p>Нажмите на фото, чтобы открыть категорию</p>
    </header>

    <main>
        <!-- Контейнер для сетки категорий -->
        <div class="categories-grid">
            
            <!-- Блок одной категории (дублируйте этот блок для каждой новой категории) -->
            <a href="#" class="category-card">
                <img src="images/category1.jpg" alt="Описание первой фотографии">
                <div class="overlay">
                    <h3>Природа</h3>
                </div>
            </a>

            <a href="#" class="category-card">
                <img src="images/category2.jpg" alt="Описание второй фотографии">
                <div class="overlay">
                    <h3>Архитектура</h3>
                </div>
            </a>

            <a href="#" class="category-card">
                <img src="images/category3.jpg" alt="Описание третьей фотографии">
                <div class="overlay">
                    <h3>Технологии</h3>
                </div>
            </a>

            <a href="#" class="category-card">
                <img src="images/category4.jpg" alt="Описание четвертой фотографии">
                <div class="overlay">
                    <h3>Еда</h3>
                </div>
            </a>

        </div>
    </main>

</body>
</html>
